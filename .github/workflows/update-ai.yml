name: AI Olami - tekshirish, yangilash va joylash

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-olami-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      publish: ${{ steps.save.outputs.publish }}
    permissions:
      contents: write
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
        with:
          # A queued schedule/dispatch may predate a bot commit. Start from the
          # latest main so it never attempts to push an obsolete snapshot.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mantiq va xavfsizlik testlari
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.js
          node --check assets/site.js
      - name: Bepul manbalarni tekshirish
        if: github.event_name != 'pull_request'
        run: python -m scripts.update_catalog
      - name: Ochiq kataloglarni birlashtirish
        if: github.event_name != 'pull_request'
        run: python -m scripts.sync_catalog
      - name: Chiqariladigan ma’lumotlarni tekshirish
        if: github.event_name != 'pull_request'
        run: |
          python -m scripts.validate_data
          python -m scripts.sync_catalog --check
      - name: Natijalarni saqlash
        id: save
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::notice::Main changed while sources were checked; the queued push run will publish the latest code."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai-candidates.json data/approved-ai.json data/promo-candidates.json data/monitor-status.json data/ai-olami-tools.json
          if ! git diff --cached --quiet; then
            git commit -m "Katalog va rasmiy takliflarni tekshirish"
            git push
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Faqat sayt fayllarini tayyorlash
        if: steps.save.outputs.publish == 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/approved-ai.json data/promo-candidates.json data/monitor-status.json data/ai-olami-tools.json _site/data/
          touch _site/.nojekyll
      - name: Pages fayllari
        if: steps.save.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    if: needs.update.outputs.publish == 'true'
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pages sozlamalari
        uses: actions/configure-pages@v5
      - name: Saytni joylash
        id: deployment
        uses: actions/deploy-pages@v4
